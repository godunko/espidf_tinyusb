name = "espidf_tinyusb"
version = "0.1.0-dev"
website = "https://github.com/godunko/espidf_tinyusb"
description = "Ada/ESP-IDF: TinyUSB device stack bindings"
long-description = """
Ada bindings for Espressif's TinyUSB integration (`espressif/esp_tinyusb`).

Covers configuration and installation of the TinyUSB device driver. USB device classes
are provided by separate crates, e.g. `espidf_tinyusb_msc` for Mass Storage Class.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "*"
